# Configuración de Alice Core. Los valores aquí sobreescriben los defaults;
# las variables de entorno ALICE_* sobreescriben este archivo.

[event_bus]
max_queue_size = 1000

[logging]
level = "INFO"
log_dir = "logs"
file_name = "alice.log"
to_console = true

[plugins]
plugins_dir = "plugins"
# enabled: allowlist. Si tiene elementos, SOLO se cargan esos plugins.
#   Vacía (default) = cargar todos los descubiertos.
#   Para correr sin webcam/micrófono: enabled = ["console"]
# disabled: denylist. Estos nunca se cargan (se aplica tras la allowlist).
#   Ej. para arrancar sin hardware pesado: disabled = ["vision", "voice_web"]
enabled = []
disabled = []

[tools]
default_timeout_seconds = 10.0
granted_permissions = ["read_system"]

[llm]
# provider = "null": arranca sin servidor (respuestas en crudo).
# provider = "openai_compat": OpenAI, LM Studio, Ollama o cualquier servidor
#   con API /v1/chat/completions. Local vs nube = solo cambia base_url (+ api_key).
provider = "openai_compat"

# --- OpenAI (nube) ---
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"                    # barato y con function calling (necesario para el bucle agente)
# La API key NO va aquí (este archivo está en git). Ponla en `.env` como
# ALICE_LLM__API_KEY=sk-...  (ver .env.example). También vale una variable de entorno.

# --- LM Studio (local), para volver más adelante: comenta lo de arriba y usa esto ---
# base_url = "http://127.0.0.1:1234/v1"   # Ollama: http://localhost:11434/v1
# model = "local-model"                   # LM Studio ignora este valor y usa el modelo cargado

temperature = 0.7
max_tokens = 512
timeout_seconds = 60.0
narrate = true                          # con provider="null" se fuerza a false automáticamente
history_turns = 6

[planner]
# "rules":        solo regex (determinista, sin LLM).
# "hybrid":       regex primero; si nada aplica, el LLM clasifica la intención
#                 en un catálogo cerrado de intenciones.
# "tool_calling": regex primero; si nada aplica, el LLM elige tools del catálogo
#                 REAL (function calling) en UNA vuelta.
# "agent_loop":   regex primero; si nada aplica, entra el bucle agente multi-vuelta
#                 (razona → usa tools → observa → repite) hasta max_agent_iters.
#                 Mejor con un modelo fuerte (p.ej. glm-4.7-flash); con modelos
#                 pequeños el regex sigue cubriendo lo habitual.
strategy = "agent_loop"
intent_timeout_seconds = 20.0
# Tope de vueltas del bucle agente por turno (cortafuegos anti-bucle-infinito).
max_agent_iters = 6

[memory]
db_path = "data/alice.db"
short_term_max_items = 200
